name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test

  # macOS ships bash 3.2, the oldest bash git-tidy supports; run the suite
  # with git-tidy under /bin/bash so 3.2 compatibility is gated, not just
  # promised. (shellcheck already runs in the ubuntu job.)
  test-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm stock bash is 3.2
        run: /bin/bash --version | grep -F 'version 3.2'
      - name: Run tests under bash 3.2
        run: TIDY_BASH=/bin/bash bash test/run.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run --version
        run: |
          make install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/git-tidy" --version
      - name: --help exits 0
        run: |
          "$RUNNER_TEMP/prefix/bin/git-tidy" --help >/dev/null
