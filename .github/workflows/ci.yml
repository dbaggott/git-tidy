name: ci

on:
  pull_request:
    # `ready_for_review` runs CI when a draft is marked ready; the jobs below skip while it is one.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test

  # macOS ships bash 3.2, the oldest bash git-tidy supports; run the suite
  # with git-tidy under /bin/bash so 3.2 compatibility is gated, not just
  # promised. (shellcheck already runs in the ubuntu job.)
  test-bash32:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm stock bash is 3.2
        run: /bin/bash --version | grep -F 'version 3.2'
      - name: Run tests under bash 3.2
        run: TIDY_BASH=/bin/bash bash test/run.sh

  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run --version
        run: |
          make install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/git-tidy" --version
      - name: --help exits 0
        run: |
          "$RUNNER_TEMP/prefix/bin/git-tidy" --help >/dev/null

  # The single context branch protection requires. Which jobs gate a merge is then this
  # file's business rather than a Terraform change — `needs:` is the list.
  #
  # ⚠️ `if: always()` is load-bearing: without it this job is SKIPPED when a dependency
  # fails, and a skipped check reports SUCCESS to branch protection.
  ci-required:
    if: always()
    needs: [test, test-bash32, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
