name: release

# A merge to main that bumps VERSION= in the git-tidy script IS a release:
# this workflow tags the commit v<VERSION>, publishes a GitHub Release with
# generated notes, and updates the Homebrew tap formula. Pushes that don't
# change VERSION (or re-runs after a release) find the tag already present
# and skip the tag/release step. Tagging, releasing, and the tap update
# live in one workflow because tags created with the workflow's
# GITHUB_TOKEN do not trigger other workflows.
#
# workflow_dispatch (main only) re-runs the sha + tap steps against the
# existing release, recovering a release-created-but-tap-push-failed run;
# it is idempotent when the tap is already current.

on:
  push:
    branches: [main]
    paths: ['git-tidy']
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: two quick merges must not both see "no tag" and race to
# create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Dispatch can target any branch; only ever release from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git-tidy
        uses: actions/checkout@v4

      - name: Read script version and check for existing tag
        id: meta
        run: |
          version="$(grep -E '^VERSION=' git-tidy | head -1 | cut -d'"' -f2)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read VERSION from git-tidy script"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to release."
            echo "new=false" >>"$GITHUB_OUTPUT"
          else
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi
          echo "tag=$tag"         >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.meta.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes

      - name: Compute tarball SHA256
        if: steps.meta.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        id: sha
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${{ steps.meta.outputs.tag }}.tar.gz" -o tarball.tgz
          sha="$(sha256sum tarball.tgz | awk '{print $1}')"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        if: steps.meta.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: dbaggott/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.meta.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG:     ${{ steps.meta.outputs.tag }}
          SHA256:  ${{ steps.sha.outputs.sha256 }}
        run: |
          mkdir -p tap/Formula
          # No explicit `version` line: brew infers it from the tag in the
          # url, and `brew audit` flags a derivable version as redundant.
          cat >tap/Formula/git-tidy.rb <<RUBY
          class GitTidy < Formula
            desc "Clean up git worktrees, stale branches, and pack objects"
            homepage "https://github.com/dbaggott/git-tidy"
            url "https://github.com/dbaggott/git-tidy/archive/refs/tags/$TAG.tar.gz"
            sha256 "$SHA256"
            license "MIT"

            def install
              bin.install "git-tidy"
            end

            test do
              assert_match "git-tidy $VERSION", shell_output("#{bin}/git-tidy --version")
            end
          end
          RUBY

      - name: Commit and push formula
        if: steps.meta.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-tidy.rb
          if git diff --staged --quiet; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git commit -m "git-tidy ${{ steps.meta.outputs.tag }}"
          git push
